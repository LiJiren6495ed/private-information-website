<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF1 Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>

    <aside class="sidebar">
        <a href="https://www.doubao.com/chat" target="_blank" class="nav-item" title="DouBao">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 8.38 8.38 0 0 1 3.8.9L21 3l-1.5 5.5Z" />
                <circle cx="11" cy="11" r="1" fill="currentColor"/>
            </svg>
        </a>
        <a href="https://chat.deepseek.com/" target="_blank" class="nav-item" title="DeepSeek">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" />
                <path d="M12 22V12" />
                <path d="M21 7l-9 5L3 7" />
            </svg>
        </a>
        <a href="https://gemini.google.com" target="_blank" class="nav-item" title="Gemini">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
            </svg>
        </a>
        <a href="https://ecampus.nwpu.edu.cn/" target="_blank" class="nav-item" title="NWPU">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <!-- 外圆 -->
                <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1" fill="none"/>
                <!-- 内环 -->
                <circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="0.5" fill="none"/>
            </svg>
        </a>
        <div class="sidebar-bottom">
            <div class="icon">⏻</div>
        </div>
    </aside>

    <main class="content">
        <header class="top-nav">
            <nav>
                <a href="#" class="active">首页</a>
                <a href="#">多人模式</a>
                <a href="#">战役</a>
                <a href="#">士兵</a>
                <a href="#">商店</a>
                <a href="#">更多</a>
            </nav>
            <div class="logo">LIJIREN 6495ED</div>
        </header>

        <section class="welcome-area">
            <h2 id="welcome-text">士兵, 午安。</h2>
        </section>

        <section class="card-grid">
            <a href="https://www.bilibili.com" id="bili-link" target="_blank" style="text-decoration: none;">
                <div class="card big" id="bili-card">
                    <div class="card-info">
                        <h3 id="bili-tag">哔哩哔哩 · 热门</h3>
                        <p id="bili-title">加载中...</p>
                    </div>
                </div>
            </a>
            <a href="https://github.com/" id="git-link" target="_blank" style="text-decoration: none;">
                <div class="card big" id="git-card">
                    <div class="card-info">
                        <h3 id="git-tag">GITHUB</h3>
                        <p id="git-title">GLOBAL REPOSITORIES</p>
                    </div>
                </div>
            </a>
            <div class="card big highlight">
                <div class="card-info">
                    <h3>行动战役</h3>
                    <p>加里波利</p>
                </div>
            </div>
        </section>

        <section class="bottom-row">
            <div class="mini-card search-card">
                <form id="search-form">
                    <input type="text" id="search-input" placeholder="等待指令...">
                </form>
            </div>
            <div class="mini-card clock-card">
                <div id="clock">00:00</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
