<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF1 Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>

    <aside class="sidebar">
        <div class="nav-icons">
            <div class="icon active">🛡️</div>
            <div class="icon">🔥</div>
            <div class="icon">🎯</div>
            <div class="icon">👤</div>
        </div>
        <div class="bottom-icons">
            <div class="icon">❓</div>
            <div class="icon">⏻</div>
        </div>
    </aside>

    <main class="content">
        <header class="top-nav">
            <nav>
                <a href="#" class="active">首页</a>
                <a href="#">多人模式</a>
                <a href="#">战役</a>
                <a href="#">士兵</a>
                <a href="#">商店</a>
                <a href="#">更多</a>
            </nav>
            <div class="logo">LIJIREN 6495ED</div>
        </header>

        <section class="welcome-area">
            <h2 id="welcome-text">士兵, 午安。</h2>
        </section>

        <section class="card-grid">
            <a href="https://www.bilibili.com" id="bili-link" target="_blank" style="text-decoration: none;">
                <div class="card big" id="bili-card">
                    <div class="card-info">
                        <h3 id="bili-tag">哔哩哔哩 · 热门</h3>
                        <p id="bili-title">加载中...</p>
                    </div>
                </div>
            </a>
            <div class="card big" style="background-image: url('img/2.jpg')">
                <div class="card-info">
                    <h3>征服</h3>
                    <p>所有地图</p>
                </div>
            </div>
            <div class="card big highlight">
                <div class="card-info">
                    <h3>行动战役</h3>
                    <p>加里波利</p>
                </div>
            </div>
        </section>

        <section class="bottom-row">
            <div class="mini-card search-card">
                <form id="search-form">
                    <input type="text" id="search-input" placeholder="等待指令...">
                </form>
            </div>
            <div class="mini-card clock-card">
                <div id="clock">00:00</div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
